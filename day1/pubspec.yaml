name: myShopApp
description: A Flutter shop app with basic navigation and a static product list.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.5

  auto_route:  ^7.1.0

  http: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.1

  auto_route_generator: ^7.1.1
  build_runner: ^2.4.0
  

flutter:
  uses-material-design: true